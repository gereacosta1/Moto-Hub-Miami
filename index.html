<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Bavarian Euro Performance — European performance parts, upgrades and accessories for drivers in Miami and South Florida."
    />

    <meta
      name="theme-color"
      content="#090909"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      property="og:title"
      content="Bavarian Euro Performance | European Performance Parts"
    />

    <meta
      property="og:description"
      content="European performance parts, upgrades and accessories for drivers in Miami and South Florida."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Bavarian Euro Performance"
    />

    <meta
      property="og:image"
      content="/new-logo.jpeg"
    />

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Bavarian Euro Performance | European Performance Parts"
    />

    <meta
      name="twitter:description"
      content="European performance parts, upgrades and accessories for drivers in Miami and South Florida."
    />

    <meta
      name="twitter:image"
      content="/new-logo.jpeg"
    />

    <link
      rel="icon"
      type="image/jpeg"
      href="/new-logo.jpeg"
    />

    <title>
      Bavarian Euro Performance | European Performance Parts
    </title>
  </head>

  <body>
    <div id="root"></div>

    <!--
      Static Netlify form definition.
      The visible form is rendered by React in Contact.tsx.
    -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="contact"
      />

      <input
        type="text"
        name="name"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="tel"
        name="phone"
      />

      <select name="topic">
        <option value="product">
          Product inquiry
        </option>

        <option value="fitment">
          Fitment help
        </option>

        <option value="availability">
          Availability
        </option>

        <option value="general">
          General question
        </option>
      </select>

      <input
        type="text"
        name="vehicle"
      />

      <input
        type="text"
        name="product"
      />

      <textarea name="message"></textarea>
    </form>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
